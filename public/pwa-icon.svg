<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(256, 256)">
    <!-- Cart Body -->
    <path d="M -80 -40 L -60 20 L 60 20 L 80 -40 Z" 
          fill="white" stroke="none"/>
    
    <!-- Cart Handle -->
    <path d="M -60 -40 Q -80 -60 -80 -80 Q -80 -100 -60 -100 L -20 -100" 
          fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="-40" cy="40" r="12" fill="white"/>
    <circle cx="40" cy="40" r="12" fill="white"/>
    
    <!-- Package/Box inside cart -->
    <rect x="-30" y="-20" width="40" height="30" fill="#7c3aed" rx="4"/>
    <path d="M -30 -5 L -10 -5 L -10 10 L -30 10 Z" fill="#4c1d95"/>
  </g>
  
  <!-- Text "EK" (EzyKasir) -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">EK</text>
</svg>
